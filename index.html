<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>3쿠션 교류전 대진표 생성기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap">
<style>
/* Layout: 단일 컬럼 모바일 우선. 상단 당구대 레일(다이아몬드)=스텝 표시, 하단 고정 액션 바. 다크 단일 테마(의도적). */
:root{
  --bg:#05070a; --surface:#0b1016; --surface-2:#111922; --line:#1d2833; --line-2:#2a3743;
  --felt:#0a3d31; --felt-hi:#11604c; --felt-ink:#cfe9df;
  --team-a:#d4af37; --team-b:#3dbb93; /* 팀 이름 글자색. B는 --felt-hi 그대로면 대비 2.4:1이라 같은 계열의 밝은 톤 */
  --gold:#d4af37; --gold-hi:#e6c35c; --gold-ink:#1f1806; --gold-grad:linear-gradient(180deg,#f3dc8a 0%,#d4af37 48%,#b8912a 100%);
  --rail:#2a1a0d; --rail-hi:#4a2e16;
  --ink:#e9edf0; --muted:#8a97a3; --faint:#5b6773;
  --danger:#f87171; --danger-bg:#2b1012; --warn-bg:#2c1c05; --ok:#4ade80; --ok-bg:#0b2419;
  --bar:rgba(5,7,10,.94);
  --f-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 128px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.app{width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px} /* width:100%: margin:auto로 늘어나지 않으면 넓은 표가 #main을 화면 밖으로 밀어냄 */
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

/* Header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:20px}
.eyebrow{font-family:var(--f-num);font-size:11px;letter-spacing:.18em;color:var(--gold-hi);text-transform:uppercase}
h1{margin:2px 0 0;font-size:26px;font-weight:900;letter-spacing:-.02em;text-wrap:balance}
.vsline{margin:2px 0 0;color:var(--muted);font-size:14px}
.vsline b{color:var(--ink);font-weight:700}
.topr{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.store{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.store::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.store.off::before{background:var(--danger)}
.store.off{color:var(--danger)}

/* Rail = step indicator */
.rail{position:relative;background:var(--felt);border:6px solid var(--rail);border-radius:14px;box-shadow:inset 0 0 0 1px var(--rail-hi),inset 0 8px 24px rgba(0,0,0,.35);
  display:grid;grid-template-columns:repeat(4,1fr);padding:12px 4px 10px}
.rail::before{content:"";position:absolute;left:12.5%;right:12.5%;top:22px;height:1px;background:rgba(207,233,223,.18)}
.stp{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0 2px;cursor:pointer;min-height:48px}
.stp:disabled{cursor:default}
.dia{width:14px;height:14px;transform:rotate(45deg);border:1.5px solid rgba(207,233,223,.45);background:var(--felt);transition:background .2s,border-color .2s}
.stp.done .dia{background:var(--felt-ink);border-color:var(--felt-ink)}
.stp.cur .dia{width:20px;height:20px;margin:-3px 0;transform:none;border:0;border-radius:50%; /* 현재 단계: 레일 다이아몬드 위의 노란 3쿠션 공 */
  background:radial-gradient(circle at 34% 30%,#fffbe6 0 9%,#f6dc6a 24%,#d9a514 62%,#8c6406 100%);
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));animation:ballPulse 1.2s ease-in-out infinite}
@keyframes ballPulse{0%,100%{box-shadow:0 0 0 0 rgba(230,195,92,0)}50%{box-shadow:0 0 0 6px rgba(230,195,92,.45)}}
@media (prefers-reduced-motion:reduce){.stp.cur .dia{animation:none;box-shadow:0 0 0 4px rgba(230,195,92,.3)}}
.stp span{font-size:12px;color:rgba(207,233,223,.6);white-space:nowrap}
.stp.cur span{color:var(--ink);font-weight:700}
.stp.done span{color:var(--felt-ink)}

/* Panels & type */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.h{margin:0;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.h small{font-size:13px;font-weight:500;color:var(--muted)}
.hint{margin:0;font-size:13px;color:var(--muted)}
code{font-family:var(--f-num);font-size:12px;background:var(--surface-2);padding:1px 6px;border-radius:4px;color:var(--gold-hi)}
.fld{display:flex;flex-direction:column;gap:6px}
/* 경기 날짜·시간: iOS 기본 날짜 칸은 최소 너비 때문에 넘치고 아이콘이 없어, 직접 그린 칸 위에 투명한 실제 입력을 겹침 */
.dt{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.dtp{position:relative;flex:1 1 190px;min-width:0;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;font-size:15px;cursor:pointer;overflow:hidden}
.dtp.t{flex:1 1 120px}
.dtp svg{flex:none;color:var(--gold-hi)}
.dtp b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtp input,.dtp select{position:absolute;inset:0;width:100%;height:100%;min-height:0;margin:0;padding:0;border:0;opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.dtp:focus-within{border-color:var(--gold)}
.fld>span{font-size:13px;color:var(--muted);letter-spacing:.02em}
input[type=text],input:not([type]),input[type=date],select,textarea{width:100%;min-height:48px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{resize:vertical;font-family:var(--f-num);font-size:15px;line-height:1.6}
input::placeholder,textarea::placeholder{color:var(--faint)}
input.err,select.err{border-color:var(--danger);background:var(--danger-bg)}
.tag{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-family:var(--f-num);font-size:12px;font-weight:700}
.tag.tA{background:var(--gold);color:var(--gold-ink)}
.tag.tB{background:var(--felt-hi);color:var(--felt-ink)}
.fld input.tnA{color:var(--team-a);font-weight:700;border-color:rgba(212,175,55,.45)}
.fld input.tnB{color:var(--team-b);font-weight:700;border-color:rgba(61,187,147,.45)}
.app .tcA{color:var(--team-a)}.app .tcB{color:var(--team-b)}

/* Buttons */
.btn{min-height:52px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);padding:0 18px;font-size:16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,background .2s}
.btn:active{transform:scale(.98)}
.btn.gold{background:var(--gold-grad);border-color:#b8912a;color:var(--gold-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn.felt{background:var(--felt);border-color:var(--felt-hi);color:var(--felt-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;font-size:14px;padding:0 14px}
.btn.xs{min-height:36px;font-size:13px;padding:0 12px;border-radius:9px}
.btn.danger{color:var(--danger);border-color:rgba(248,113,113,.4)}
.btn[aria-disabled=true]{opacity:.5}

/* Stepper */
.stepper{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
.stepper.sm{grid-template-columns:44px 64px 44px}
.sbtn{height:56px;border:0;background:transparent;font-size:24px;cursor:pointer;color:var(--gold-hi)}
.stepper.sm .sbtn{height:44px;font-size:20px}
.sbtn:disabled{color:var(--faint);cursor:default}
.snum{text-align:center;font-size:14px;color:var(--muted)}
.snum b{font-family:var(--f-num);font-size:24px;color:var(--ink);margin-right:2px}
.stepper.sm .snum b{font-size:18px}

/* Step 1 */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tcard{border:1px solid var(--line-2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.tlabel{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}

/* Step 2 */
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.paste{border:1px dashed var(--line-2);border-radius:12px;padding:0 12px;scroll-margin-top:calc(16px + env(safe-area-inset-top,0px))}
#pgrp{display:flex;flex-direction:column;gap:8px}
#mp[open]{border-style:solid;border-color:rgba(230,195,92,.45)}
.paste summary{min-height:46px;display:flex;align-items:center;cursor:pointer;font-size:14px;font-weight:500;color:var(--gold-hi);list-style:none}
.paste summary::-webkit-details-marker{display:none}
.paste summary::before{content:"+";font-family:var(--f-num);margin-right:8px}
.paste[open] summary::before{content:"−"}
.paste[open]{padding-bottom:12px}
.paste[open]>*:not(summary){margin-bottom:10px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:26px minmax(0,1fr) 84px 44px;gap:8px;align-items:center}
.p80{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.prow.phead{font-size:12px;color:var(--muted);letter-spacing:.04em;padding-bottom:2px;border-bottom:1px solid var(--line)}
.prow.phead span:nth-child(2){padding-left:12px}
.prow.phead span:nth-child(3),.prow.phead span:nth-child(4){text-align:center}
.prow.phead span:nth-child(4){color:var(--gold-hi);font-weight:700}
.p80 b{font-family:var(--f-num);font-size:17px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.pno{font-family:var(--f-num);font-size:13px;color:var(--faint);text-align:right}
.sc{position:relative}
.sc input{padding-right:30px;font-family:var(--f-num);text-align:right}
.sc span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}
.note{border-radius:12px;padding:12px 14px;font-size:14px;border:1px solid var(--line-2);background:var(--surface)}
.note ul{margin:6px 0 0;padding-left:18px}
.note.bad{border-color:rgba(248,113,113,.45);background:var(--danger-bg);color:#fecaca}
.note.warn{border-color:rgba(230,195,92,.4);background:var(--warn-bg);color:#f3e2a6}
.note.ok{border-color:rgba(74,222,128,.3);background:var(--ok-bg);color:#bbf7d0}
.note.sample{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-color:rgba(230,195,92,.4);background:var(--warn-bg);color:#f3e2a6}
#vbox{display:flex;flex-direction:column;gap:8px}

/* Step 3 */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line-2);background:var(--bg);border-radius:12px;padding:14px 14px 14px 46px;cursor:pointer;position:relative;min-height:56px}
.opt::before{content:"";position:absolute;left:16px;top:18px;width:16px;height:16px;border-radius:50%;border:2px solid var(--faint)}
.opt.on{border-color:var(--gold);background:var(--warn-bg)}
.opt.on::before{border-color:var(--gold-hi);background:radial-gradient(var(--gold-hi) 45%,transparent 50%)}
.opt b{display:block;font-size:15px}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px} /* 모든 회원 버튼을 같은 폭으로 */
.pchip{height:36px;min-width:0;padding:0 8px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;overflow:hidden}
.pchip small{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.pchip.on{background:var(--gold-grad);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
.pchip small{display:inline-flex;align-items:baseline;gap:3px}
.pchip small i{font-style:normal;opacity:.6}
.pchip small b{color:var(--gold-hi);font-weight:700}
.pchip.on small{color:var(--gold-ink)}
.pchip.on small b{color:var(--gold-ink);text-decoration:underline;text-underline-offset:2px}
.gtab{display:grid;gap:4px;font-size:14px}
.gtab>div{display:grid;grid-template-columns:minmax(0,1.4fr) 1fr 1fr;gap:8px;align-items:center;padding:6px 10px;border-radius:8px;background:var(--bg)}
.gtab>div:first-child{background:none;font-size:12px;color:var(--muted)}
.gtab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtab b{font-family:var(--f-num);font-size:18px;text-align:center}
.gtab [role=columnheader]{text-align:center}
.chip.grp.hi{color:var(--gold-hi);border-color:rgba(230,195,92,.5)}
.chip.grp.lo{color:var(--felt-ink);border-color:var(--felt-hi)}
.chip.grp.x{color:var(--danger);border-color:rgba(248,113,113,.45)}
.tbtns{display:flex;gap:6px}
.tbtns [data-act=bgm][aria-pressed=true]{color:var(--gold-hi);border-color:var(--gold)}
.tbtns [data-act=bgm].pending{animation:bgmPulse 1.2s ease-in-out infinite} /* 켜짐이지만 첫 탭 전이라 아직 재생 전 */
.paste summary.pending{animation:bgmPulse 1.2s ease-in-out infinite;border-radius:10px;padding:0 10px;margin:0 -10px} /* 상대 팀이 아직 임시 명단 */
@keyframes bgmPulse{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,0)}50%{box-shadow:0 0 0 5px rgba(212,175,55,.45);background:rgba(212,175,55,.18)}}
@media (prefers-reduced-motion:reduce){.tbtns [data-act=bgm].pending,.paste summary.pending{animation:none;background:rgba(212,175,55,.18)}}
.htab{display:grid;gap:4px;font-size:14px}
.hrow{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(4,minmax(36px,.6fr));gap:6px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--bg)}
.htab.mem .hrow{grid-template-columns:minmax(64px,1.3fr) repeat(6,minmax(34px,.6fr))}
.hrow.hhead{background:none;font-size:12px;color:var(--muted);padding-block:2px}
.hrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow b{font-family:var(--f-num);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.hrow.hhead span:not(:first-child){text-align:center}
.cw{color:var(--gold-hi)}.cl{color:var(--muted)}
.hscroll{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
.htab.mem{min-width:360px}
.evs{display:flex;flex-direction:column;gap:8px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.ev summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 14px;min-height:56px}
.ev summary::-webkit-details-marker{display:none}
.evd{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.evt{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evs2{display:flex;align-items:center;gap:8px}
.evs2 b{font-family:var(--f-num);font-size:16px}
.res{font-style:normal;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;border:1px solid var(--line-2);color:var(--muted)}
.res.win{background:var(--gold-hi);border-color:var(--gold-hi);color:var(--gold-ink)}
.res.lose{color:var(--danger);border-color:rgba(248,113,113,.45)}
.evb{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.glist{display:flex;flex-direction:column;gap:2px;font-size:14px}
.gl{display:grid;grid-template-columns:60px minmax(0,1fr) 24px minmax(0,1fr);gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.gl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl small{font-family:var(--f-num);color:var(--muted);font-size:11px}
.gn{font-family:var(--f-num);font-size:11px;color:var(--muted);text-align:left;white-space:nowrap}
.gv{font-family:var(--f-num);font-size:10px;color:var(--faint);text-align:center}
.gl span:last-child{text-align:right}
.gw{color:var(--gold-hi);font-weight:700}.gx{color:var(--faint)}
.winhint{margin:0 0 -6px;font-size:13px;color:var(--gold-hi);text-align:center}
.tauto{font-style:normal;font-size:11px;color:var(--gold-hi);border:1px solid rgba(230,195,92,.45);border-radius:999px;padding:0 7px;margin-left:4px}
.tlink{background:none;border:0;padding:0 2px;margin-left:4px;font-size:12px;color:var(--gold-hi);text-decoration:underline;text-underline-offset:2px;cursor:pointer;min-height:24px}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:22px minmax(0,1fr) 26px minmax(0,1fr);gap:6px;align-items:center}
.mrow select{font-size:15px;padding:8px}
.mrow .vs{font-family:var(--f-num);font-size:11px;color:var(--faint);text-align:center}
.mtools{display:flex;gap:8px;flex-wrap:wrap}

/* Step 4 — board */
.board{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:linear-gradient(180deg,var(--felt) 0%,#072a22 100%);border:4px solid var(--rail);border-radius:16px;
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.bteam{display:flex;align-items:center;gap:10px;min-width:0}
.bteam.b{justify-content:flex-end}
.bteam span{font-size:14px;font-weight:700;color:var(--felt-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bteam b{font-family:var(--f-num);font-size:38px;line-height:1;color:var(--ink)}
.bteam.lead b{color:var(--gold-hi)}
.bmid{text-align:center;display:flex;flex-direction:column;align-items:center}
.bmid span{font-family:var(--f-num);font-size:13px;color:var(--felt-ink)}
.bmid small{font-size:11px;color:rgba(207,233,223,.65)}
.bmid .fin{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--gold-ink);background:var(--gold-hi);border-radius:4px;padding:1px 6px;margin-bottom:2px}
.bsub{grid-column:1/-1;display:flex;justify-content:center;flex-wrap:wrap;gap:4px 16px;border-top:1px solid rgba(207,233,223,.15);padding-top:8px;font-size:12px;color:rgba(207,233,223,.75)}
.bsub span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bsub b{font-family:var(--f-num);color:var(--ink)}
.gdot{width:8px;height:8px;transform:rotate(45deg);display:inline-block}
.gdot.hi{background:var(--gold-hi)}.gdot.lo{background:var(--felt-ink)}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.meta b{color:var(--ink);font-weight:500}

<script>
(function(){
'use strict';
var KEY='cushion-xmatch-v2';
var BUILD='2026-10-18.2'; /* 배포마다 바꿈: 서버의 최신 값과 다르면 새로고침 안내 */
var RESET_ON_START=true; /* 시작할 때마다 진행 상태를 비움. 이력(LKEY/DB)은 건드리지 않음 */
var MAXP=20;
var HANDI={'강병호':'23','정종필':'24','정덕영':'25','고재건':'30','선명':'25','김영록':'23','최충광':'28','방성두':'30','최충엽':'26','황주안':'25','김재하':'28','현광렬':'22','오승준':'28','선명관':'32','한용간':'24'};
var MEMBERS=Object.keys(HANDI);
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var STEPS=['팀 설정','선수 입력','매칭','대진표'];
var storageOK=true, tried=false;

/* 경기 시간: 기본값은 현재 시각 그대로, 선택 목록은 30분 단위. 목록에 없는 현재 시각은 제자리에 한 항목으로 끼워 선택 상태를 유지 */
function hhmm(t){var m=/^(\d{2}):(\d{2})/.exec(t||'');return m&&+m[1]<24&&+m[2]<60?m[1]+':'+m[2]:''}
function nowTime(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function timeOpts(cur){var vs=[];for(var h=0;h<24;h++)for(var m=0;m<60;m+=30)vs.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));
  if(cur&&vs.indexOf(cur)<0){vs.push(cur);vs.sort()}
  return vs.map(function(v){return '<option value="'+v+'"'+(v===cur?' selected':'')+'>'+fmtTime(v)+(+v.slice(3)%30?' (현재)':'')+'</option>'}).join('')}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function blank(n){var a=[];for(var i=0;i<n;i++)a.push({name:'',score:''});return a}
function fromPairs(arr){return arr.map(function(x){return {name:x[0],score:String(x[1])}})}
function defaults(){
  return {step:1,sample:false,date:today(),time:nowTime(),scores:Object.assign({},HANDI),
    teams:{A:{name:'더 브릿지(The Bridge)',players:MEMBERS.map(function(n){return {name:n,score:HANDI[n]}})},
           B:{name:'국제(Team. KUKJE)',players:blank(MEMBERS.length)}},
    mode:'random',balance:'on',mismatch:'bye',tables:MEMBERS.length,tablesAuto:true,warn:5,cut:25,manual:[],matches:null};
}
function load(){
  var d=defaults();
  try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&o.teams&&o.teams.A&&o.teams.B)d=Object.assign(d,o)}}
  catch(e){storageOK=false}
  if(d.step===4&&!d.matches)d.step=3;
  if(!d.scores||typeof d.scores!=='object')d.scores={};
  if(typeof d.cut!=='number')d.cut=25;
  d.time=hhmm(d.time)||nowTime();
  if(typeof d.tablesAuto!=='boolean')d.tablesAuto=true;
  (function(){var n=Math.min(MAXP,Math.max(d.teams.A.players.length,d.teams.B.players.length));['A','B'].forEach(function(t){var ps=d.teams[t].players;while(ps.length<n)ps.push({name:'',score:''});ps.length=n})})();
  MEMBERS.forEach(function(n){if(!d.scores[n])d.scores[n]=HANDI[n]});
  d.teams.A.players.forEach(function(p){var n=String(p.name).trim();if(HANDI[n]&&!String(p.score).trim())p.score=HANDI[n]});
  if(d.teams.A.name==='더 브릿지')d.teams.A.name='더 브릿지(The Bridge)';
  if(d.teams.B.name==='상대팀'||d.teams.B.name==='국제(KUKJE)')d.teams.B.name='국제(Team. KUKJE)';
  return d;
}
function fresh(){try{localStorage.removeItem(KEY)}catch(e){storageOK=false}return defaults()}
var S=RESET_ON_START?fresh():load();
var saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(function(){
  try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}
  var el=$('#store');el.textContent=storageOK?'자동 저장됨':'저장 불가 · 새로고침 시 사라짐';el.classList.toggle('off',!storageOK);
},250)}

/* helpers */
function P(t,i){return S.teams[t].players[i]}
function sc(p){return parseInt(p.score,10)||0}
function tn(t){return S.teams[t].name.trim()||t+'팀'}
/* 표시용 짧은 이름: 상대 팀 자동 이름 '국제(Team. KUKJE)-01' → 'KUKJE-01'. 저장값과 직접 입력한 이름은 그대로 */
/* 상대 팀 명단에 자동 이름(임시 데이터)이 남아 있는지 */
function tempB(){var b=tn('B');return S.teams.B.players.some(function(p){var n=String(p.name).trim();return /-\d{2}$/.test(n)&&n.slice(0,-3)===b})}
function pasteSum(t){var tmp=t==='B'&&tempB();return '<summary id="ps-'+t+'"'+(tmp?' class="pending"':'')+'>여러 명 한꺼번에 붙여넣기'+(tmp?' (임시 설정 상태임)':'')+'</summary>'}
function dn(name){name=String(name).trim();var b=tn('B'),m=name.match(/-(\d{2})$/);
  if(!m||name!==b+'-'+m[1])return name;var q=b.match(/\(([^)]*)\)/),sh=q?q[1].replace(/^team\.?\s*/i,'').trim():'';
  return (sh||b)+'-'+m[1]}
function tnh(t){return '<span class="tc'+t+'">'+esc(tn(t))+'</span>'}
function cnt(t){return S.teams[t].players.length}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function idx(t){return S.teams[t].players.map(function(_,i){return i})}
function rankOrder(t){return shuffle(idx(t)).sort(function(x,y){return sc(P(t,y))-sc(P(t,x))})}
function p80(v){var n=parseInt(v,10);return n>0?String(Math.round(n*0.8)):'–'}
function fmtTime(t){if(!/^\d{2}:\d{2}/.test(t||''))return'';var h=+t.slice(0,2);return (h<12?'오전 ':'오후 ')+((h%12)||12)+':'+t.slice(3,5)}
function fmtDateLong(d){if(!d)return'';var w='일월화수목금토'[new Date(d+'T00:00:00').getDay()];return d.replace(/-/g,'. ')+(w?'('+w+'요일)':'')}
function fmtWhen(){var t=fmtTime(S.time);return fmtDate(S.date)+(t?' '+t:'')}
function fmtDate(d){if(!d)return'';var w='일월화수목금토'[new Date(d+'T00:00:00').getDay()];return d.replace(/-/g,'.')+(w?'('+w+')':'')}
function invalidate(){S.matches=null}
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show')},2200)}

/* modal */
var mOk=null;
function modal(o){
  $('#mTitle').textContent=o.title;$('#mBody').innerHTML=o.html||'';
  var ok=$('#mOk');ok.textContent=o.ok||'확인';ok.className='btn '+(o.danger?'danger':'gold');ok.hidden=!!o.noOk;
  $('#mCancel').textContent=o.cancel||'취소';mOk=o.onOk||null;$('#modal').hidden=false;
  setTimeout(function(){var ta=$('#mBody textarea');if(ta){ta.focus();ta.select()}else ok.focus()},30);
}
function closeModal(){$('#modal').hidden=true;mOk=null}
$('#mCancel').addEventListener('click',closeModal);
$('#mOk').addEventListener('click',function(){var f=mOk;closeModal();if(f)f()});
$('#modal').addEventListener('click',function(e){if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

/* validation */
function validate(){
  var errs=[],notes=[],f={};
  ['A','B'].forEach(function(t){
    var seen={};
    S.teams[t].players.forEach(function(p,i){
      var n=p.name.trim(),s=String(p.score).trim();
      if(!n){errs.push({k:'empty',m:tn(t)+' '+(i+1)+'번: 이름이 비어 있습니다.'});f[t+'n'+i]='empty'}
      else{var k=n.toLowerCase();(seen[k]=seen[k]||[]).push(i)}
      if(!s){errs.push({k:'empty',m:tn(t)+' '+(i+1)+'번: 점수가 비어 있습니다.'});f[t+'s'+i]='empty'}
      else if(!/^\d{1,2}$/.test(s)||+s<1){errs.push({k:'bad',m:tn(t)+' '+(i+1)+'번: 점수는 1~99 숫자로 입력하세요.'});f[t+'s'+i]='bad'}
    });
    Object.keys(seen).forEach(function(k){var a=seen[k];if(a.length>1){
      errs.push({k:'bad',m:tn(t)+': "'+P(t,a[0]).name.trim()+'" 이름이 '+a.map(function(i){return i+1}).join('·')+'번에 중복됩니다.'});
      a.forEach(function(i){f[t+'n'+i]='bad'})}});
  });
  var an={};S.teams.A.players.forEach(function(p){var n=p.name.trim().toLowerCase();if(n)an[n]=1});
  var both=S.teams.B.players.map(function(p){return p.name.trim()}).filter(function(n){return n&&an[n.toLowerCase()]});
  if(both.length)notes.push('양 팀에 같은 이름이 있습니다: '+both.join(', ')+'. 헷갈리면 이름 뒤에 구분 표시를 붙이세요.');
  return {errs:errs,notes:notes,f:f,ok:!errs.length};
}
function fieldBad(v,key){var x=v.f[key];return x==='bad'||(x==='empty'&&tried)}
function vbox(v){
  if(v.ok&&!v.notes.length)return '<div class="note ok">✓ 명단 확인 완료 · '+tnh('A')+' '+cnt('A')+'명 : '+tnh('B')+' '+cnt('B')+'명</div>';
  var h='';
  var shown=v.errs.filter(function(e){return tried||e.k==='bad'});
  var empties=v.errs.filter(function(e){return e.k==='empty'}).length;

  else if(empties){h+='<div class="note warn">빈칸 '+empties+'곳이 남아 있습니다.</div>'}

/* matching */
function limit(t){var o=t==='A'?'B':'A',n=cnt(t),m=cnt(o);if(n>=m)return 1;return S.mismatch==='bye'?1:Math.ceil(m/n)}
/* 무작위 배정에서 점수 차가 경고 기준 이상인 대결을 줄임: 무작위 자리 교환을 반복하며 비용이 나빠지지 않으면 받아들임(같은 비용도 받아들여 무작위성 유지) */
function balance(ra,rb,n){
  function cost(){var c=0;for(var i=0;i<n;i++){var d=Math.abs(sc(P('A',ra[i]))-sc(P('B',rb[i])));if(d>=S.warn)c+=1000+d}return c}
  var cur=cost();
  for(var k=0;k<2000&&cur>0;k++){var a=Math.random()<0.5?ra:rb,i=Math.floor(Math.random()*a.length),j=Math.floor(Math.random()*a.length);if(i===j)continue;
    var x=a[i];a[i]=a[j];a[j]=x;var c=cost();if(c<=cur)cur=c;else{a[j]=a[i];a[i]=x}}
}
function buildAuto(){
  var bigT=cnt('A')>=cnt('B')?'A':'B',smT=bigT==='A'?'B':'A',out=[],rest=[];
  function pair(a,b,g){return {A:a,B:b,winner:null,extra:null,grp:g||null}}
  if(S.mode==='random'){
    var ra=shuffle(idx('A')),rb=shuffle(idx('B')),n=Math.min(ra.length,rb.length);
    if(S.balance!=='off')balance(ra,rb,n);
    for(var i=0;i<n;i++)out.push(pair(ra[i],rb[i]));
    rest=(bigT==='A'?ra:rb).slice(n);
  }else{
    var cut=S.cut,ord={A:rankOrder('A'),B:rankOrder('B')},left={A:[],B:[]};
    ['hi','lo'].forEach(function(g){
      var a=ord.A.filter(function(x){return g==='hi'?sc(P('A',x))>cut:sc(P('A',x))<=cut});
      var b=ord.B.filter(function(x){return g==='hi'?sc(P('B',x))>cut:sc(P('B',x))<=cut});
      var k=Math.min(a.length,b.length);
      for(var j=0;j<k;j++)out.push(pair(a[j],b[j],g));
      left.A=left.A.concat(a.slice(k));left.B=left.B.concat(b.slice(k));
    });
    ['A','B'].forEach(function(t){left[t].forEach(function(x){var m={A:null,B:null,winner:null,extra:null,grp:sc(P(t,x))>cut?'hi':'lo'};m[t]=x;out.push(m)})});
    return out;
  }
  if(rest.length){
    var sm=idx(smT);
    function mk(b,s){var m={winner:null,extra:s==null?null:smT,grp:null};m[bigT]=b;m[smT]=s;return m}
    if(S.mismatch==='bye'){rest.forEach(function(b){out.push(mk(b,null))})}
    else if(S.mismatch==='double-random'){var pool=[];rest.forEach(function(b){if(!pool.length)pool=shuffle(sm);out.push(mk(b,pool.pop()))})}
    else{
      var use={};sm.forEach(function(x){use[x]=1});
      rest.forEach(function(b){
        var bs=sc(P(bigT,b)),mn=Math.min.apply(null,sm.map(function(x){return use[x]}));
        var cd=shuffle(sm.filter(function(x){return use[x]===mn}));
        cd.sort(function(x,y){return Math.abs(sc(P(smT,x))-bs)-Math.abs(sc(P(smT,y))-bs)});
        use[cd[0]]++;out.push(mk(b,cd[0]));
      });
    }
  }
  return out;
}
function ensureManual(){
  var n=Math.max(cnt('A'),cnt('B'));if(!Array.isArray(S.manual))S.manual=[];
  while(S.manual.length<n)S.manual.push({A:'',B:''});S.manual.length=n;
  S.manual.forEach(function(r){['A','B'].forEach(function(t){if(r[t]!==''&&+r[t]>=cnt(t))r[t]=''})});
}
function usage(){var u={A:{},B:{}};S.manual.forEach(function(r){['A','B'].forEach(function(t){if(r[t]!=='')u[t][r[t]]=(u[t][r[t]]||0)+1})});return u}
function buildManual(){
  ensureManual();var out=[],seen={A:{},B:{}};
  S.manual.forEach(function(r){
    var a=r.A===''?null:+r.A,b=r.B===''?null:+r.B;if(a==null&&b==null)return;
    var ex=null;
    if(a!=null){if(seen.A[a])ex='A';seen.A[a]=1}
    if(b!=null){if(seen.B[b])ex='B';seen.B[b]=1}
    out.push({A:a,B:b,winner:null,extra:ex});
  });
  ['A','B'].forEach(function(t){idx(t).forEach(function(i){if(!seen[t][i]){var m={A:null,B:null,winner:null,extra:null};m[t]=i;out.push(m)}})});
  return out;
}
function schedule(pairs){
  var T=Math.max(1,S.tables),rounds=[],games=[],byes=[];
  pairs.forEach(function(m){
    m={A:m.A,B:m.B,winner:m.winner||null,extra:m.extra||null,grp:m.grp||null};
    if(m.A==null||m.B==null){m.bye=true;m.winner=null;byes.push(m);return}
    var r=0;
    for(;;r++){if(!rounds[r])rounds[r]={n:0,p:{}};var R=rounds[r];if(R.n<T&&!R.p['A'+m.A]&&!R.p['B'+m.B])break}
    var Rr=rounds[r];Rr.n++;Rr.p['A'+m.A]=1;Rr.p['B'+m.B]=1;m.round=r+1;m.table=Rr.n;games.push(m);
  });
  games.sort(function(x,y){return x.round-y.round||x.table-y.table});
  games.forEach(function(m,i){m.no=i+1});
  return games.concat(byes);
}
function generate(){S.savedId=null;S.matches=schedule(S.mode==='manual'?buildManual():buildAuto())}
function games(){return (S.matches||[]).filter(function(m){return !m.bye})}
function hasResults(){return games().some(function(m){return m.winner})}
function tally(){var g=games(),a=0,b=0,ba=0,bb=0,G={hi:{a:0,b:0},lo:{a:0,b:0}},hasG=false;
  g.forEach(function(m){if(m.grp)hasG=true;var w=m.winner;if(!w)return;if(w==='A')a++;else b++;if(G[m.grp])G[m.grp][w==='A'?'a':'b']++});
  (S.matches||[]).forEach(function(m){if(!m.bye)return;var t=m.A!=null?'A':'B';if(t==='A')ba++;else bb++;if(G[m.grp]){hasG=true;G[m.grp][t==='A'?'a':'b']++}});
  return {a:a+ba,b:b+bb,ba:ba,bb:bb,done:a+b,total:g.length,G:G,hasG:hasG}}
function hasTies(){return ['A','B'].some(function(t){var s={};return S.teams[t].players.some(function(p){var k=sc(p);if(s[k])return true;s[k]=1;return false})})}

function applyPicked(){var sel=MEMBERS.filter(function(m){return picked[m]});
  S.teams.A.players.forEach(function(p){var n=p.name.trim();if(n&&p.score)S.scores[n]=p.score});
  var extra=S.teams.A.players.filter(function(p){var n=p.name.trim();return n&&MEMBERS.indexOf(n)<0});
  var list=sel.map(function(n){return {name:n,score:S.scores[n]||''}}).concat(extra).slice(0,MAXP);
  if(!list.length)list=[{name:'',score:''}];
  S.teams.A.players=list;syncFrom('A');S.manual=[];invalidate()}
document.addEventListener('toggle',function(e){if(e.target&&e.target.id==='mp')mpOpen=e.target.open},true);
function filledGroups(t){var hi=0,lo=0,un=0;S.teams[t].players.forEach(function(p){var v=String(p.score).trim();
  if(!/^\d{1,2}$/.test(v)||+v<1){if(p.name.trim())un++;return}if(+v>S.cut)hi++;else lo++});return {hi:hi,lo:lo,un:un}}
function pickGroupInner(){var a=filledGroups('A'),b=filledGroups('B'),bOn=b.hi+b.lo>0,bFull=bOn&&b.hi+b.lo===cnt('B');
  var h='<div class="gtab" role="table" aria-label="그룹 구성"><div role="row"><span role="columnheader">그룹 구성</span><span role="columnheader">'+(S.cut+1)+'점 이상</span><span role="columnheader">'+S.cut+'점 이하</span></div>'+
    '<div role="row"><span role="rowheader">'+tnh('A')+'</span><b>'+a.hi+'</b><b>'+a.lo+'</b></div>'+
    (bOn?'<div role="row"><span role="rowheader">'+tnh('B')+(bFull?'':' (입력 중)')+'</span><b>'+b.hi+'</b><b>'+b.lo+'</b></div>':'')+'</div>';
  if(a.un)h+='<p class="hint">핸디가 없는 선수 '+a.un+'명은 그룹 계산에서 빠져 있습니다.</p>';
  if(!bOn)h+='<p class="hint">'+tnh('B')+' 선수 핸디를 입력하면 예상 부전승을 계산합니다.</p>';
  else{var hx=Math.abs(a.hi-b.hi),lx=Math.abs(a.lo-b.lo);
    h+=hx+lx?'<div class="note warn">예상 부전승 '+(hx+lx)+'명 ('+(S.cut+1)+'점 이상 '+hx+'명 · '+S.cut+'점 이하 '+lx+'명)'+(bFull?'':' · 현재 입력 기준')+'</div>':'<div class="note ok">그룹 인원이 맞아 부전승이 없습니다.'+(bFull?'':' (현재 입력 기준)')+'</div>'}
  return h}
function memberPicker(){
  if(!picked){picked={};var cur={};S.teams.A.players.forEach(function(p){cur[p.name.trim()]=1});MEMBERS.forEach(function(m){picked[m]=!!cur[m]})}
  var c=MEMBERS.filter(function(m){return picked[m]}).length;
  return '<details class="paste" id="mp"'+(mpOpen?' open':'')+'><summary>회원 명단에서 출전자 고르기 ('+MEMBERS.length+'명)</summary>'+
    '<p class="hint">오늘 나오는 회원만 선택된 상태로 두세요. 누를 때마다 아래 명단에 바로 반영되고, 핸디와 80% 점수가 자동으로 채워집니다. 칩의 숫자는 <b>핸디 · 80%</b>입니다. 명단에 없는 게스트는 아래 입력칸에 직접 추가하면 유지됩니다.</p>'+
    '<div class="chips">'+MEMBERS.map(function(m){return '<button type="button" class="pchip'+(picked[m]?' on':'')+'" data-act="pickToggle" data-n="'+esc(m)+'" aria-pressed="'+!!picked[m]+'">'+esc(m)+(S.scores[m]?'<small>'+esc(S.scores[m])+'<i>·</i><b>'+p80(S.scores[m])+'</b></small>':'')+'</button>'}).join('')+'</div>'+
    '<div class="mtools"><button type="button" class="btn xs ghost" data-act="pickAll" data-v="1">전체 선택</button><button type="button" class="btn xs ghost" data-act="pickAll" data-v="0">전체 해제</button><span class="hint" id="pickCnt" style="align-self:center">'+pickLabel(c)+'</span></div>'+
    '<div id="pgrp">'+pickGroupInner()+'</div></details>';
}
var MODE={random:'무작위',rank:'점수 그룹',manual:'수동'};
function boardHTML(){var t=tally(),fin=t.total>0&&t.done===t.total;
  return '<div class="bteam a'+(t.a>t.b?' lead':'')+'"><span>'+tnh('A')+'</span><b>'+t.a+'</b></div>'+
    '<div class="bmid">'+(fin?'<span class="fin">FINAL</span>':'')+'<span>'+t.done+'/'+t.total+'</span><small>경기 입력</small></div>'+
    '<div class="bteam b'+(t.b>t.a?' lead':'')+'"><b>'+t.b+'</b><span>'+tnh('B')+'</span></div>'+
    (t.hasG||t.ba||t.bb?'<div class="bsub">'+(t.hasG?'<span><i class="gdot hi"></i>'+(S.cut+1)+'점 이상 <b>'+t.G.hi.a+' : '+t.G.hi.b+'</b></span><span><i class="gdot lo"></i>'+S.cut+'점 이하 <b>'+t.G.lo.a+' : '+t.G.lo.b+'</b></span>':'')+
      (t.ba||t.bb?'<span>부전승 포함 '+t.ba+' : '+t.bb+'</span>':'')+'</div>':'')}
function card(m){
  var A=P('A',m.A),B=P('B',m.B),d=Math.abs(sc(A)-sc(B)),hot=d>=S.warn;
  function side(t,p){var w=m.winner===t,l=m.winner&&!w;
    return '<button type="button" class="side s'+t+(w?' win':'')+(l?' lose':'')+'" data-act="win" data-no="'+m.no+'" data-w="'+t+'" aria-pressed="'+w+'" aria-label="'+esc(p.name)+' 승리 입력"><span class="pname">'+esc(dn(p.name))+'</span><span class="pscore">'+sc(p)+'</span><span class="wtag">'+(w?'승':'탭하여 승 입력')+'</span></button>'}
  var ex=m.extra?'<span class="chip">'+esc(dn(P(m.extra,m[m.extra]).name))+' 2경기째</span>':'';
  return '<article class="match'+(hot?' hot':'')+'" id="g'+m.no+'"><div class="mhead"><span class="mh-l">'+ex+'</span><span class="gno" title="'+m.no+'경기">Table '+m.table+'</span>'+
    '<span class="diff'+(hot?' hot':'')+'">점수 차 '+d+'</span></div><div class="mbody">'+side('A',A)+'<span class="vs">VS</span>'+side('B',B)+'</div></article>';
}
function step4(){
  if(!S.matches)return '<div class="note">아직 대진표가 없습니다. 매칭 단계에서 만들어 주세요.</div>';
  var g=games(),byes=S.matches.filter(function(m){return m.bye}),maxR=g.reduce(function(a,m){return Math.max(a,m.round)},0);
  var hot=g.filter(function(m){return Math.abs(sc(P('A',m.A))-sc(P('B',m.B)))>=S.warn}).length;
  var h='<div class="board" id="board">'+boardHTML()+'</div>'+
  '<section class="panel"><div class="meta"><span><b>'+esc(fmtWhen())+'</b></span><span>'+MODE[S.mode]+' 매칭</span><span>테이블 '+S.tables+'대</span><span>'+g.length+'경기'+(maxR>1?' · '+maxR+'라운드':'')+'</span>'+(hot?'<span style="color:var(--gold-hi)">점수 차 '+S.warn+'점 이상 '+hot+'경기</span>':'')+'</div>'+
  '<div class="cfg no-print"><div class="fld"><span>테이블 수 (바꾸면 재배정) '+tblNote()+'</span>'+numStep('tables',1,MAXP,'대')+'</div><div class="fld"><span>점수 차 경고 기준</span>'+numStep('warn',1,20,'점 이상')+'</div></div></section>';
  if(g.length)h+='<p class="winhint no-print">선수를 누르면 승자로 표시되고, 다시 누르면 해제됩니다.</p>';
  for(var r=1;r<=maxR;r++){
    var rg=g.filter(function(m){return m.round===r});
    h+=(maxR>1?'<h3 class="round">'+r+'라운드</h3>':'')+'<div class="games">'+rg.map(card).join('')+'</div>';
  }
  if(byes.length)h+='<h3 class="round">부전승 <small style="font-weight:500;letter-spacing:0;color:var(--muted)">팀 승수에 1승씩 포함</small></h3><div class="byes">'+byes.map(function(m){var t=m.A!=null?'A':'B',p=P(t,m[t]);
    return '<div class="bye"><span>'+esc(dn(p.name))+' <span class="pscore">'+sc(p)+'</span></span><em>'+tnh(t)+(m.grp?' · '+(m.grp==='hi'?(S.cut+1)+'점 이상':S.cut+'점 이하'):'')+' · 부전승</em></div>'}).join('')+'</div>';
  h+='<div class="acts no-print">'+
    (S.mode==='random'?'<button type="button" class="btn felt" data-act="reshuffle">다시 섞기</button>':'')+
    (S.mode==='rank'&&hasTies()?'<button type="button" class="btn felt" data-act="reshuffle">동점자 순서 다시 섞기</button>':'')+
    (hasResults()?'<button type="button" class="btn ghost" data-act="clearResults">승패 입력 지우기</button>':'')+
    '<button type="button" class="btn gold" data-act="saveHist">'+(S.savedId?'이력 업데이트':'이력에 저장')+'</button></div>'+
    (S.savedId?'<p class="hint no-print" style="text-align:center">이력에 저장된 교류전입니다. 승패를 바꾼 뒤에는 <b>이력 업데이트</b>를 눌러 주세요.</p>':'<p class="hint no-print" style="text-align:center">결과 입력을 마치면 이력에 저장해 두세요. 다음 교류전 준비에 쓸 수 있습니다.</p>');
  return h;
}
function renderBar(){
  var b='';
  if(VIEW==='history')b='<button type="button" class="btn gold" data-act="histBack">대진표로 돌아가기</button>';
  else if(S.step===1)b='<button type="button" class="btn gold" data-act="go" data-s="2">다음 · 선수 입력</button>';
  else if(S.step===2)b='<button type="button" class="btn back ghost" data-act="go" data-s="1">이전</button><button type="button" class="btn gold" data-act="next2">다음 · 매칭 방식</button>';
  else if(S.step===3)b='<button type="button" class="btn back ghost" data-act="go" data-s="2">이전</button><button type="button" class="btn gold" data-act="make">대진표 만들기</button>';
  else b='<button type="button" class="btn back ghost" data-act="go" data-s="3">매칭 변경</button><button type="button" class="btn gold" data-act="copy">카톡용 복사</button>';
  $('#barIn').innerHTML=b;
}
function tblNote(){return S.tablesAuto?'':'<button type="button" class="tlink" data-act="tblAuto">출전자 수('+cnt('A')+'대)로 맞추기</button>'}
function syncTables(){if(!S.tablesAuto)return;var n=Math.min(MAXP,Math.max(1,cnt('A')));if(S.tables!==n){S.tables=n;if(S.matches)S.matches=schedule(S.matches)}}
/* 상대 팀 빈 이름 칸을 '팀명-01' 형태로 채움. 자동 이름은 순서대로 다시 번호를 매기고 팀 이름 변경을 따라감.
   점수가 빈 자동 선수에는 우리 팀 점수 중 하나를 골라 ±2점 흔든 임의 점수를 넣음(우리 팀 점수가 없으면 25±3) */
function autoB(){var base=tn('B'),old=S.autoBase||base;
  var as=S.teams.A.players.map(sc).filter(function(v){return v>0}),rnd=function(n){return Math.floor(Math.random()*(2*n+1))-n};
  var guess=function(){return String(Math.min(99,Math.max(1,as.length?as[Math.floor(Math.random()*as.length)]+rnd(2):25+rnd(3))))};
  var re=function(b){return new RegExp('^'+b.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'-\\d{2}$')},ro=re(old),rb=re(base);
  S.teams.B.players.forEach(function(p,i){var n=p.name.trim();if(!n||ro.test(n)||rb.test(n)){p.name=base+'-'+String(i+1).padStart(2,'0');if(!String(p.score).trim())p.score=guess()}});
  S.autoBase=base}
function render(scrollTop){
  autoB();syncTables();
  if(S.step>1&&!canGo(S.step))S.step=S.step===4&&validate().ok?3:2;
  renderRail();
  $('#main').innerHTML=VIEW==='history'?historyView():[null,step1,step2,step3,step4][S.step]();
  renderBar();save();
  if(scrollTop)window.scrollTo({top:0,behavior:'auto'});
}

/* share text */
function shareText(){
  function tn(t){return (t==='A'?'🟡':'🟢')+(S.teams[t].name.trim()||t+'팀')}
  var g=games(),byes=S.matches.filter(function(m){return m.bye}),maxR=g.reduce(function(a,m){return Math.max(a,m.round)},0),t=tally();
  var L=['🎱 '+tn('A')+' vs '+tn('B')+' 교류전 대진표 ('+fmtWhen()+')'],cur=0;
  g.forEach(function(m){
    if(maxR>1&&m.round!==cur){cur=m.round;L.push('','['+cur+'라운드]')}
    var A=P('A',m.A),B=P('B',m.B);
    var s='Table '+m.table+' '+dn(A.name)+'('+sc(A)+') vs '+dn(B.name)+'('+sc(B)+')';
    if(m.winner)s+=' → '+dn((m.winner==='A'?A:B).name)+' 승';
    L.push(s);
  });
  if(byes.length)L.push('','부전승: '+byes.map(function(m){var tt=m.A!=null?'A':'B',p=P(tt,m[tt]);return dn(p.name)+'('+sc(p)+', '+tn(tt)+')'}).join(', '));
  if(t.done){L.push('','🏆 '+(t.done===t.total?'최종 스코어':'현재 스코어')+' '+tn('A')+' '+t.a+' : '+t.b+' '+tn('B')+(t.done<t.total?' ('+t.done+'/'+t.total+'경기 입력)':''));
    if(t.hasG)L.push('   · '+(S.cut+1)+'점 이상 '+t.G.hi.a+' : '+t.G.hi.b+' / '+S.cut+'점 이하 '+t.G.lo.a+' : '+t.G.lo.b);
    if(t.ba||t.bb)L.push('   · 부전승 포함 ('+tn('A')+' '+t.ba+', '+tn('B')+' '+t.bb+')')}
  return L.join('\n');
}

/* history */
var VIEW='main',DB=null,HIST=[],histMode='loading',saving=false,openEv={};
var LKEY='cushion-xmatch-history-v1';
function localHist(){try{var a=JSON.parse(localStorage.getItem(LKEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function setLocalHist(a){try{localStorage.setItem(LKEY,JSON.stringify(a));return true}catch(e){return false}}
function sortHist(a){return a.slice().sort(function(x,y){return String(y.date).localeCompare(String(x.date))||String(y.time||'').localeCompare(String(x.time||''))||(y.savedAt||0)-(x.savedAt||0)})}
function useLocal(){DB=null;histMode='local';HIST=sortHist(localHist());if(VIEW==='history')render()}
(function initDb(){
  var c=window.claude;
  if(!c||typeof c.use!=='function'){useLocal();return}
  Promise.resolve(c.use('db')).then(function(db){
    if(!db){useLocal();return}
    DB=db;
    try{
      db.collection('events').orderBy('date','desc').limit(300).onSnapshot(function(snap){
        HIST=sortHist(snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o}));
        histMode='db';if(VIEW==='history')render();
      },function(){useLocal()});
    }catch(e){useLocal()}
  },function(){useLocal()});
})();
document.addEventListener('toggle',function(e){var t=e.target;if(t&&t.classList&&t.classList.contains('ev'))openEv[t.dataset.id]=t.open},true);

function buildRecord(){var t=tally(),now=Date.now();
  function pl(t2,i){var p=P(t2,i);return {n:p.name.trim(),s:sc(p)}}
  return {date:S.date,time:S.time,savedAt:now,teamA:tn('A'),teamB:tn('B'),mode:S.mode,cut:S.cut,tables:S.tables,
    a:t.a,b:t.b,ba:t.ba,bb:t.bb,hasG:t.hasG,hiA:t.G.hi.a,hiB:t.G.hi.b,loA:t.G.lo.a,loB:t.G.lo.b,done:t.done,total:t.total,
    rosterA:S.teams.A.players.map(function(_,i){return pl('A',i)}),rosterB:S.teams.B.players.map(function(_,i){return pl('B',i)}),
    games:games().map(function(m){var A=pl('A',m.A),B=pl('B',m.B);return {no:m.no,r:m.round,t:m.table,a:A.n,as:A.s,b:B.n,bs:B.s,w:m.winner||'',g:m.grp||''}}),
    byes:S.matches.filter(function(m){return m.bye}).map(function(m){var tt=m.A!=null?'A':'B',x=pl(tt,m[tt]);return {t:tt,n:x.n,s:x.s,g:m.grp||''}})};
}
function outcome(r){if(r.done<r.total)return {k:'ing',l:'진행 중'};return r.a>r.b?{k:'win',l:'승'}:r.a<r.b?{k:'lose',l:'패'}:{k:'draw',l:'무'}}
function historyView(){
  var note=histMode==='db'?'이 아티팩트에 저장되어, 링크를 공유받은 회원도 같은 이력을 봅니다.':histMode==='local'?'이 기기 브라우저에만 저장됩니다. 브라우저 데이터를 지우면 함께 사라집니다.':'이력을 불러오는 중입니다.';
  var h='<section class="panel"><h2 class="h">교류전 이력 <small>'+HIST.length+'회</small></h2><p class="hint">'+note+'</p>'+
    (HIST.length?'<div class="mtools"><button type="button" class="btn sm felt" data-act="expAll" data-f="pdf">전체 이력 PDF</button><button type="button" class="btn sm danger" data-act="histReset" style="margin-left:auto">이력 초기화</button></div><p class="hint">상대별 전적, 회원별 성적, 모든 교류전 기록이 한 파일로 저장됩니다. 교류전 하나만 내보내려면 아래 기록을 펼치세요.</p>':'')+'</section>';
  if(!HIST.length)return h+'<div class="note">아직 저장된 교류전이 없습니다. 대진표 화면에서 <b>이력에 저장</b>을 누르면 첫 기록이 생깁니다.</div>';
  /* opponents */
  var opp={};HIST.forEach(function(r){var o=outcome(r);var k=r.teamB||'상대팀';var x=opp[k]=opp[k]||{n:0,win:0,lose:0,draw:0,ing:0};x.n++;x[o.k]++});
  h+='<section class="panel"><h2 class="h">상대별 전적 <small>'+esc(HIST[0].teamA||tn('A'))+' 기준</small></h2><div class="htab"><div class="hrow hhead"><span>상대 팀</span><span>교류전</span><span>승</span><span>패</span><span>무</span></div>'+
    Object.keys(opp).map(function(k){var x=opp[k];return '<div class="hrow"><span>'+esc(k)+'</span><b>'+x.n+'</b><b class="cw">'+x.win+'</b><b class="cl">'+x.lose+'</b><b>'+x.draw+'</b></div>'}).join('')+'</div>'+
    (Object.keys(opp).some(function(k){return opp[k].ing})?'<p class="hint">결과 입력이 끝나지 않은 교류전은 승패에서 제외했습니다.</p>':'')+'</section>';
  /* members */
  var mem={};
  HIST.forEach(function(r){var seen={};
    (r.rosterA||[]).forEach(function(p){if(!p.n)return;var x=mem[p.n]=mem[p.n]||{ev:0,w:0,l:0,bye:0,last:p.s};if(!seen[p.n]){x.ev++;seen[p.n]=1}});
    (r.games||[]).forEach(function(g){var x=mem[g.a];if(!x||!g.w)return;if(g.w==='A')x.w++;else x.l++});
    (r.byes||[]).forEach(function(b){if(b.t==='A'&&mem[b.n])mem[b.n].bye++});
  });

  if(exporting)return;if(!recs.length){toast('내보낼 기록이 없습니다');return}
  exporting=true;toast((fmt==='pdf'?'PDF':'Word')+' 파일을 만드는 중입니다');
  var c=window.claude,dlP=c&&typeof c.use==='function'?Promise.resolve(c.use('downloads')).catch(function(){return null}):Promise.resolve(null);
  var name=full?'교류전이력_'+safeName(recs[0].teamA||tn('A'))+'_'+today():'교류전결과_'+recs[0].date+'_'+safeName(recs[0].teamA)+'_vs_'+safeName(recs[0].teamB);
  name=name.replace(/ /g,'')+'.'+fmt;
  Promise.all([dlP,(fmt==='pdf'?buildPdf:buildDocx)(recs,full)]).then(function(res){var dl=res[0],blob=res[1];
    if(!dl){exporting=false;saveLocal(blob,name);return} /* 일반 웹(GitHub Pages 등): 브라우저 다운로드로 저장 */
    return dl.save({filename:name,data:blob}).then(function(r){exporting=false;if(r&&r.status==='saved')toast('파일을 저장했습니다')},function(e){exporting=false;var c2=e&&e.code;
      if(c2==='declined')return;if(c2==='rate_limited')toast('저장 창이 이미 열려 있습니다');else if(c2==='extension_not_enabled')toast('이 화면에서는 '+fmt.toUpperCase()+' 저장을 쓸 수 없습니다');else toast('파일을 저장하지 못했습니다')});
  }).catch(function(){exporting=false;toast('파일을 만들지 못했습니다. 네트워크를 확인한 뒤 다시 시도해 주세요')});
}

  clearResults:function(){modal({title:'승패 입력 지우기',html:'<p>모든 경기의 승패 입력을 지웁니다. 대진은 그대로 유지됩니다.</p>',ok:'지우기',danger:true,onOk:function(){S.matches.forEach(function(m){m.winner=null});render()}})},
  histReset:function(){var n=HIST.length;if(!n)return;
    modal({title:'이력을 모두 삭제할까요?',html:'<p>저장된 교류전 <b>'+n+'건</b>과 상대별 전적, 회원별 성적이 모두 지워집니다. 되돌릴 수 없습니다.</p><p style="margin-top:8px">보관이 필요하면 먼저 <b>전체 이력 PDF</b>로 내보내 두세요.</p>',ok:n+'건 모두 삭제',danger:true,onOk:function(){
      var ids=HIST.map(function(r){return r.id}),fail=0;setLocalHist([]);
      function fin(){S.savedId=null;save();if(!DB)HIST=[];openEv={};render();toast(fail?'일부 기록('+fail+'건)을 지우지 못했습니다. 다시 시도해 주세요':'이력을 모두 삭제했습니다')}

      ids.reduce(function(ch,id){return ch.then(function(){return DB.collection('events').doc(id).delete().catch(function(){fail++})})},Promise.resolve()).then(fin)}})},

    VIEW='main';S.step=2;mpOpen=true;S.date=today();render(true);var d=$('#mp');if(d)d.scrollIntoView({block:'start'});
    toast(fmtDate(r.date)+' 출전자 '+cnt('A')+'명을 불러왔습니다')},
  delHist:function(b){var id=b.dataset.id,r=HIST.find(function(x){return x.id===id});if(!r)return;

/* BGM: Web Audio 합성 스릴러 루프(D단조 128BPM, 8마디). 매번 켜짐으로 시작, 자동재생이 막히면 첫 사용자 입력 때 시작 */
var BGM=(function(){
  var AC=window.AudioContext||window.webkitAudioContext;
  var ctx=null,out=null,noise=null,timer=null,next=0,step=0,on=true,SPB=60/128/4;
  var ROOT=[38,34,31,33,38,34,31,33],
      PAD=[[50,53,57],[46,50,53],[43,46,50],[45,49,52]],
      LEAD=[74,75,74,0,74,75,77,0,74,75,74,0,73,74,73,0];
  function hz(m){return 440*Math.pow(2,(m-69)/12)}
  function env(t,a,peak,dur){var g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(out);return g}
  function osc(type,f,t,dur,vol,cut,a){var o=ctx.createOscillator(),lp=ctx.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(f,t);lp.type='lowpass';lp.frequency.setValueAtTime(cut,t);o.connect(lp);lp.connect(env(t,a||0.005,vol,dur));o.start(t);o.stop(t+dur+0.05);return o}
  function kick(t){var o=ctx.createOscillator();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+0.18);o.connect(env(t,0.003,0.9,0.3));o.start(t);o.stop(t+0.35)}
  function hiss(t,dur,vol,f0,f1){var s=ctx.createBufferSource(),f=ctx.createBiquadFilter();s.buffer=noise;f.type=f1?'bandpass':'highpass';f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);s.connect(f);f.connect(env(t,f1?dur*0.9:0.002,vol,dur));s.start(t);s.stop(t+dur+0.05)}
  function play(i,t){
    var bar=Math.floor(i/16)%8,s=i%16,r=ROOT[bar],late=bar>=4;
    if(s%2===0)osc('sawtooth',hz(s===14?r+12:r),t,SPB*1.6,0.22,late?900:600);
    if(s===0||s===8||(late&&(s===4||s===12))||(bar===7&&s>=12))kick(t);
    hiss(t,0.04,s%4===2?0.12:0.05,7000);
    if(s===0)PAD[bar%4].forEach(function(m){osc('sawtooth',hz(m),t,SPB*16,0.035,1400,0.6).detune.setValueAtTime(m%2?7:-7,t)});
    if(late&&LEAD[s])osc('square',hz(LEAD[s]),t,SPB*0.9,0.05,2500);
    if(bar===7&&s===0)hiss(t,SPB*16,0.18,300,6000);
  }
  function tick(){while(next<ctx.currentTime+0.12){play(step++,next);next+=SPB}}
  function run(){if(!on||!ctx||ctx.state!=='running'||timer)return;next=ctx.currentTime+0.05;timer=setInterval(tick,25);ui()}
  function halt(){clearInterval(timer);timer=null;if(ctx)ctx.suspend();ui()}
  function start(){if(!on||!AC)return;
    if(!ctx){ctx=new AC();var comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ctx.destination);
      out=ctx.createGain();out.gain.value=0.9;out.connect(comp);
      noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);var d=noise.getChannelData(0);for(var k=0;k<d.length;k++)d[k]=Math.random()*2-1}
    var p=ctx.resume();if(p&&p.then)p.then(run,function(){});else run();ui()}
  function ui(){var b=document.getElementById('bgmBtn');if(!b)return;b.setAttribute('aria-pressed',String(on));b.textContent=on?'♪ 켜짐':'♪ 꺼짐';var wait=on&&!timer;b.classList.toggle('pending',wait);b.title=wait?'화면을 탭하면 배경음악이 재생됩니다':'';b.hidden=!AC}
  function unlock(e){if(!timer&&!(e.target.closest&&e.target.closest('#bgmBtn')))start()}
  /* 터치는 손을 뗄 때(pointerup/touchend/click)만 소리 허용으로 인정하는 브라우저(iOS Safari 등)가 있어 함께 감지 */
  ['pointerdown','pointerup','touchend','click','keydown'].forEach(function(ev){document.addEventListener(ev,unlock,{capture:true,passive:true})});
  document.addEventListener('visibilitychange',function(){if(document.hidden){if(timer)halt()}else start()});
  /* 승 입력 효과음: A 승=상승 팡파르, B 승=하강 두 음, 취소=짧은 클릭. BGM을 끄면 함께 끔 */
  function sfx(w){if(!on||!ctx||ctx.state!=='running')return;var t=ctx.currentTime+0.01;
    if(w==='A')[74,78,81,86].forEach(function(m,k){osc('square',hz(m),t+k*0.07,k===3?0.45:0.12,0.16,4500)});
    else if(w==='B')[62,57].forEach(function(m,k){osc('sawtooth',hz(m),t+k*0.16,0.28,0.2,1800)});
    else osc('triangle',hz(93),t,0.05,0.12,8000)}
  return {start:start,ui:ui,sfx:sfx,toggle:function(){if(on&&!timer){start();return}on=!on;if(on)start();else halt()}};
})();
act.bgm=function(){BGM.toggle()};
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b||b.disabled)return;var f=act[b.dataset.act];if(f)f(b)});
/* 데스크톱(마우스)에서는 칸 어디를 눌러도 선택기를 열고, 터치 기기는 기본 동작(탭하면 선택기)에 맡김 */
document.addEventListener('click',function(e){var i=e.target.closest&&e.target.closest('.dtp input');if(i&&i.showPicker&&matchMedia('(pointer:fine)').matches)try{i.showPicker()}catch(_){}});
document.addEventListener('input',function(e){var el=e.target;
  if(el.dataset.f){var p=P(el.dataset.t,+el.dataset.i),f=el.dataset.f,v=el.value;
    if(f==='score'){v=v.replace(/[^\d]/g,'').slice(0,2);if(v!==el.value)el.value=v}
    if(p[f]===v)return;p[f]=v;
    if(f==='score'){var q=document.getElementById('p80-'+el.dataset.t+'-'+el.dataset.i);if(q)q.textContent=p80(v)}
    if(el.dataset.t==='A'&&p.name.trim()&&p.score)S.scores[p.name.trim()]=p.score;
    if(S.sample){S.sample=false;var sb=document.querySelector('.note.sample');if(sb)sb.remove()}
    if(el.dataset.t==='B'&&f==='name'){var ps=$('#ps-B');if(ps)ps.outerHTML=pasteSum('B')}
    invalidate();refreshValidation();renderRail();save();return}
  if(el.dataset.tname){S.teams[el.dataset.tname].name=el.value;renderRail();save();return}
  if(el.id==='date'){if(!el.value){el.value=S.date;return}S.date=el.value;$('#dtD').textContent=fmtDateLong(S.date);renderRail();save()}
  if(el.id==='time'){var tv=hhmm(el.value);if(!tv){el.value=S.time;return}S.time=tv;$('#dtT').textContent=fmtTime(S.time);renderRail();save()}
});
document.addEventListener('change',function(e){var el=e.target;if(el.id==='time'&&hhmm(el.value)&&hhmm(el.value)!==S.time){S.time=hhmm(el.value);$('#dtT').textContent=fmtTime(S.time);renderRail();save();return}if(el.dataset.ms){ensureManual();S.manual[+el.dataset.i][el.dataset.ms]=el.value;invalidate();render()}});

render();
BGM.ui();BGM.start();
/* GitHub Pages는 페이지를 최대 10분 캐시하므로, 캐시 없이 최신 버전을 확인해 이전 화면이면 새로고침을 안내 */
function checkUpdate(){if(!/^https?:/.test(location.protocol)||!window.fetch)return;
  fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(t){var m=/var BUILD='([^']+)'/.exec(t);
    if(m&&m[1]!==BUILD&&!$('#upd')){var d=document.createElement('div');d.id='upd';d.className='upd';d.setAttribute('role','status');
      d.innerHTML='<span>새 버전이 있습니다</span><button type="button" class="btn xs gold">새로고침</button>';d.querySelector('button').onclick=function(){location.reload()};document.body.appendChild(d)}}).catch(function(){})}
checkUpdate();document.addEventListener('visibilitychange',function(){if(!document.hidden)checkUpdate()});
})();
